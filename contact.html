      property="og:description"
      content="Request a consultation with Estate Court Accounting LLC for fiduciary accounting support."
    />
    <meta property="og:url" content="https://estatecourtaccounting.github.io/estate-court-accounting-static/contact.html" />
    <meta property="og:image" content="https://estatecourtaccounting.github.io/estate-court-accounting-static/logo.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Contact | Estate Court Accounting LLC" />
    <meta
      name="twitter:description"
      content="Request a consultation with Estate Court Accounting LLC for fiduciary accounting support."
    />
    <meta name="twitter:image" content="https://estatecourtaccounting.github.io/estate-court-accounting-static/logo.png" />
    <link rel="canonical" href="https://estatecourtaccounting.github.io/estate-court-accounting-static/contact.html" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="logo.png" />
  </head>
  <body data-page="contact">
    <header class="site-header">
      <div class="container logo-row">
        <a href="index.html" aria-label="Estate Court Accounting home">
          <img src="logo.png" alt="Estate Court Accounting logo" />
        </a>
      </div>
      <nav class="container nav">
        <a href="index.html" data-page="home">Home</a>
        <a href="about.html" data-page="about">About</a>
        <a href="services.html" data-page="services">Services</a>
        <a href="contact.html" data-page="contact">Contact</a>
      </nav>
    </header>

    <main class="section">
      <div class="container">
        <h1>Request a Consultation</h1>
        <p class="lead">Leave your information and we will follow up to help guide you.</p>

        <form
          class="card form"
          action="https://formsubmit.co/iarmstrong@estatecourtacctllc.com"
          method="POST"
          enctype="multipart/form-data"
        >
          <input type="hidden" name="_subject" value="New Estate Court Accounting inquiry" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_template" value="table" />

          <label for="name">Name</label>
          <input id="name" name="name" type="text" required />

          <label for="phone">Phone</label>
          <input id="phone" name="phone" type="tel" required />

          <label for="email">Email</label>
          <input id="email" name="email" type="email" required />

          <label for="preferredContact">Preferred Contact Method</label>
          <select id="preferredContact" name="preferredContact" required>
            <option value="">Select one</option>
            <option value="Phone">Phone</option>
            <option value="Email">Email</option>
          </select>

          <label for="notes">Reason for Inquiry</label>
          <textarea id="notes" name="notes" rows="5"></textarea>

          <label for="document">Upload Supporting Document (optional)</label>
          <input id="document" name="document" type="file" />

          <button class="btn primary" type="submit">Send Request</button>
        </form>
        <p class="note">
          Contact email: <a href="mailto:iarmstrong@estatecourtacctllc.com">iarmstrong@estatecourtacctllc.com</a>
        </p>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p class="footer-left">
          <a
            class="linkedin-link"
            href="https://www.linkedin.com/company/estate-court-accounting-llc/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Estate Court Accounting on LinkedIn"
            ><span class="linkedin-icon" aria-hidden="true">in</span></a
          >
        </p>
        <img class="footer-logo" src="logo.png" alt="Estate Court Accounting logo" />
        <p class="footer-right">
          <a href="mailto:iarmstrong@estatecourtacctllc.com">iarmstrong@estatecourtacctllc.com</a>
        </p>
      </div>
    </footer>
    <script src="site.js"></script>
  </body>
</html>
